# Regenerate: mockery (from repo root)
# gomock template vendored in tools/mockery/ until mockery ships template: gomock.

template: file://tools/mockery/gomock.templ
template-schema: file://tools/mockery/gomock.templ.schema.json

structname: "Mock{{.InterfaceName}}"

template-data:
  typed: true
  no-pkg-comment: true
  no-source-comment: true

packages:
  github.com/y-miyazaki/arc/internal/aws/helpers:
    config:
      dir: "{{.InterfaceDir}}/mocks"
      filename: "mock_{{.InterfaceName | snakecase}}.go"
      pkgname: mocks
      force-file-write: true
    interfaces:
      KMSListKeysClientInterface:
      KMSListAliasesClientInterface:
      EC2DescribeImagesClientInterface:
      EC2DescribeNetworkInterfacesClientInterface:
      EC2DescribeSecurityGroupsClientInterface:
      EC2DescribeSnapshotsClientInterface:
      EC2DescribeSubnetsClientInterface:
      EC2DescribeVolumesClientInterface:
      EC2DescribeVpcsClientInterface:
